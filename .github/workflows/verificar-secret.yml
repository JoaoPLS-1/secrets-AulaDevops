name: Verificar protecao da secret

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-secret:
    name: Exibir secret com mascaramento
    runs-on: ubuntu-latest
    steps:
      - name: Validar e exibir CHAVE_MESTRA
        shell: bash
        env:
          CHAVE_MESTRA: ${{ secrets.CHAVE_MESTRA }}
        run: |
          if [ -z "$CHAVE_MESTRA" ]; then
            echo "::error::A secret CHAVE_MESTRA nao foi configurada."
            exit 1
          fi
          echo "CHAVE_MESTRA=$CHAVE_MESTRA"
          echo "Confira no log acima se o valor foi substituido por tres asteriscos."
